name: Official metro metadata
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metro-data-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect bounded official Taipei and New Taipei metro metadata
        run: python3 ios/release/collect-metro-data.py --out "$RUNNER_TEMP/metro"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-metro-metadata
          path: ${{ runner.temp }}/metro
          if-no-files-found: ignore
          retention-days: 30
