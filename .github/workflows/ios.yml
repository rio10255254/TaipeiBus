name: iPhone app

on:
  push:
    # Feature branches are checked by pull_request or an explicit preview run.
    # Running on every branch push also starts a redundant macOS job for those events.
    branches: ['main']
    paths: ['ios/**', '.github/workflows/ios.yml', '.github/workflows/testflight.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml', '.github/workflows/testflight.yml']
  workflow_dispatch:
    inputs:
      capture_preview:
        description: 'Also launch iPhone 17 and capture native live-data screenshots'
        type: boolean
        default: false
      preview_scope:
        description: 'Choose which iPhone screens to capture'
        type: choice
        options: ['all', 'routes', 'journeys', 'journey-layout', 'navigation', 'live-settings', 'usability']
        default: 'all'
      content_revision_before:
        description: 'For live-settings verification: current live content revision'
        type: string
        default: '1'
      usability_scope:
        description: 'For usability previews: all journeys, map/search controls, or routing data only'
        type: choice
        options: ['all', 'map-controls', 'journey-selection', 'routing-only', 'app-store', 'app-store-features', 'app-store-3d', 'city-fleet', 'navigation-appearance', 'continuous-gps', 'navigation-optimization', 'navigation-details', 'navigation-onboard', 'english-mode', 'english-final', 'english-motion']
        default: 'all'
      content_revision_after:
        description: 'For live-settings verification: next live content revision'
        type: string
        default: '2'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || 'checks' }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  BUS_CONTENT_BEFORE: ${{ inputs.content_revision_before }}
  BUS_CONTENT_AFTER: ${{ inputs.content_revision_after }}

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: ${{ (inputs.usability_scope == 'english-mode' || inputs.usability_scope == 'english-final' || inputs.usability_scope == 'english-motion') && 45 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and core tests
        run: |
          xcodebuild -version
          swift test --package-path ios/TransitCore
          ruby -c ios/apple-connect.rb
          ruby ios/release/apple_client_test.rb
          python3 ios/release-check.py
          python3 ios/localization-check.py
          python3 ios/live-update.py validate runtime/settings.json
      - name: Build native app
        if: inputs.usability_scope != 'routing-only'
        run: |
          set -euo pipefail
          xcodebuild -project ios/TaipeiBus.xcodeproj -scheme TaipeiBus \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/BusBuild" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/ios-build.log"
      - name: Package simulator app for requested preview
        if: github.event_name == 'workflow_dispatch' && inputs.capture_preview && inputs.usability_scope != 'routing-only'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/BusBuild/Build/Products/Debug-iphonesimulator/TaipeiBus.app" \
            "$RUNNER_TEMP/TaipeiBus-simulator.app.zip"
      - name: Compile release app for iPhone
        if: inputs.usability_scope != 'routing-only'
        run: |
          set -euo pipefail
          xcodebuild -project ios/TaipeiBus.xcodeproj -scheme TaipeiBus \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BusBuild" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/ios-release-build.log"
      - name: Audit complete official route catalog
        if: github.event_name == 'workflow_dispatch' && inputs.capture_preview
        run: |
          set -euo pipefail
          export BUS_LIVE_FEEDS_DIRECTORY="$RUNNER_TEMP/live-transit-feeds"
          python3 - <<'PY'
          import concurrent.futures, gzip, os
          from pathlib import Path
          from urllib.request import urlopen
          root = Path(os.environ['BUS_LIVE_FEEDS_DIRECTORY'])
          root.mkdir(exist_ok=True)
          def fetch(name):
              with urlopen(f'https://tcgbusfs.blob.core.windows.net/blobbus/{name}.gz', timeout=40) as response:
                  data = response.read()
              (root / f'{name}.json').write_bytes(gzip.decompress(data) if data[:2] == b'\x1f\x8b' else data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              list(executor.map(fetch, ['GetRoute', 'GetStop', 'GetPathDetail', 'GetBusShape', 'GetBusData', 'GetEstimateTime']))
          PY
          swift test --package-path ios/TransitCore --filter RouteCatalogTests.testLiveOfficialCatalogMatchesEveryPublishedRouteAndVariant | tee "$RUNNER_TEMP/routing-audit.log"
          swift test --package-path ios/TransitCore --filter TripPlannerTests.testLiveOfficialTripsPreserveBranchStopOrderAndTransferConnections | tee -a "$RUNNER_TEMP/routing-audit.log"
          swift test --package-path ios/TransitCore --filter NavigationGuidanceTests.testLiveOfficialNeihuQueryFindsMetroPlatformsBeforeHospitalStops | tee -a "$RUNNER_TEMP/routing-audit.log"
          swift test --package-path ios/TransitCore --filter NavigationGuidanceTests.testLiveOfficialVehiclesProduceOrderedPerStopPredictionsWithExpiry | tee -a "$RUNNER_TEMP/routing-audit.log"
          swift test --package-path ios/TransitCore --filter CooperatedRouteTests.testLiveAllPublishedRoutesAndCooperatedVehicleCoverage | tee -a "$RUNNER_TEMP/routing-audit.log"
          if [ '${{ inputs.usability_scope }}' = 'routing-only' ]; then
            swift test --package-path ios/TransitCore --filter RouteRecommendationAuditTests | tee -a "$RUNNER_TEMP/routing-audit.log"
          fi
      - name: iPhone 17 launch and screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.capture_preview && inputs.usability_scope != 'routing-only'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          simctl=$(xcrun --find simctl)
          # Bound simulator RPCs and print the active command before it starts.
          sim() {
            python3 - "$simctl" "$@" <<'PY'
          import subprocess, sys
          command = sys.argv[1:]
          print('Simulator command:', ' '.join(command[1:]), file=sys.stderr, flush=True)
          timeout = 180 if command[1] in ('bootstatus', 'install', 'launch') else 60
          try:
              subprocess.run(command, check=True, timeout=timeout)
          except subprocess.TimeoutExpired:
              if command[1] not in ('install', 'get_app_container'):
                  raise
              # A freshly booted hosted simulator can stall its installation RPC.
              # Restart only this disposable device, then retry the same app once.
              print('Simulator installation/container RPC timed out; restarting this test simulator once.', file=sys.stderr, flush=True)
              simulator, device = command[0], command[2]
              subprocess.run([simulator, 'shutdown', device], check=True, timeout=60)
              subprocess.run([simulator, 'boot', device], check=True, timeout=60)
              subprocess.run([simulator, 'bootstatus', device, '-b'], check=True, timeout=180)
              subprocess.run(command, check=True, timeout=180)
          PY
          }
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; a=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and "iOS" in x["name"]]; print(sorted(a,key=lambda x:tuple(map(int,x["version"].split("."))))[-1]["identifier"])')
          device_type=com.apple.CoreSimulator.SimDeviceType.iPhone-17
          if [[ '${{ inputs.usability_scope }}' = app-store* ]]; then
            device_type=com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max
          fi
          device=$(xcrun simctl create TaipeiBus-preview "$device_type" "$runtime")
          echo "BUS_SIM_DEVICE=$device" >> "$GITHUB_ENV"
          sim boot "$device"
          sim bootstatus "$device" -b
          # CoreSimulator is already booted. simctl screenshots and XCTest do not
          # need a desktop Simulator window, whose LaunchServices RPC can stall.
          sim install "$device" "$RUNNER_TEMP/BusBuild/Build/Products/Debug-iphonesimulator/TaipeiBus.app"
          container=$(sim get_app_container "$device" com.example.TaipeiBus data)
          launch_ready() {
            token="$RANDOM-$RANDOM"
            sim launch "$device" com.example.TaipeiBus -AppleLanguages '(zh-Hant)' -AppleLocale 'zh_TW' --preview-capture "$token" "$@"
            python3 - "$container/Documents/transit-preview-ready" "$token" <<'PY'
          import sys, time
          from pathlib import Path
          marker = Path(sys.argv[1])
          deadline = time.monotonic() + 90
          while not marker.exists() or marker.read_text() != sys.argv[2]:
              if time.monotonic() > deadline:
                  raise RuntimeError('Live-data preview did not reach its requested state.')
              time.sleep(1)
          print('Requested live-data preview is ready.', flush=True)
          PY
          }
          verify_journey_ready() {
            python3 - "$container/Documents/transit-preview-journey.json" "$token" "$2" "$RUNNER_TEMP/phone-screenshots/$1-journey.json" <<'PY'
          import json, sys
          from pathlib import Path
          state = json.loads(Path(sys.argv[1]).read_text())
          assert state['token'] == sys.argv[2], 'Journey state belongs to an older launch.'
          assert state['phase'] == sys.argv[3], f'Unexpected journey phase: {state}'
          assert state['destination'] and state['rides'], 'The requested bus journey is missing.'
          if 'manual-origin' in sys.argv[4]:
              assert not state['using_location'] and state['origin'], 'Manual departure requires a selected origin.'
          if state['started']:
              assert all(ride['boarding_eta_seconds'] not in ['-2', '-3', '-4'] for ride in state['rides']), 'A known closed bus segment was started.'
          assert all(leg['verified'] and leg['seconds'] >= 0 and
              (leg['distance'] < 1 or leg['points'] >= 2) for leg in state['walks']), 'Apple walking routes were not verified.'
          Path(sys.argv[4]).write_text(json.dumps(state, ensure_ascii=False, indent=2))
          print('Native journey verified:', state['destination'], state['phase'], flush=True)
          PY
          }
          wait_route_map_ready() {
            python3 - "$container/Documents/transit-preview-map.json" "$token" "$RUNNER_TEMP/phone-screenshots/$1-camera.json" <<'PY'
          import json, math, sys, time
          from pathlib import Path
          marker, token, output = Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3])
          deadline = time.monotonic() + 90
          state = None
          while time.monotonic() < deadline:
              try:
                  state = json.loads(marker.read_text())
                  lat, lon, zoom = state['latitude'], state['longitude'], state['zoom']
                  distance = math.hypot(lat - state['expected_latitude'],
                      (lon - state['expected_longitude']) * math.cos(math.radians(lat))) * 111320
                  if (state['token'] == token and state['fully_rendered'] and
                      24.94 < lat < 25.23 and 121.35 < lon < 121.72 and
                      distance < 500 and abs(zoom - state['expected_zoom']) < 0.2):
                      output.write_text(json.dumps(state, ensure_ascii=False, indent=2))
                      print('Route camera and rendered map verified:', state['route'],
                          f'{lat:.6f}, {lon:.6f}, zoom {zoom:.2f}', flush=True)
                      break
              except (OSError, ValueError, KeyError):
                  pass
              time.sleep(1)
          else:
              raise RuntimeError(f'Route camera did not finish at the expected route: {state}')
          PY
          }
          if [ '${{ inputs.preview_scope }}' = 'all' ]; then
          launch_ready
          sleep 15
          mkdir -p "$RUNNER_TEMP/phone-screenshots"
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-home.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-station 6922
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-station.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-vehicle-route 284
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-vehicle.png"
          sim terminate "$device" com.example.TaipeiBus
          # Location is simulated here; vehicle GPS and ETAs still come from the public live feeds.
          sim location "$device" set 25.0377,121.56
          sim privacy "$device" grant location com.example.TaipeiBus
          launch_ready
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-nearby.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-station 6922 --preview-details
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-station-details.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-vehicle-route 284 --preview-details
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-vehicle-details.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-route 284
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-route.png"
          sim terminate "$device" com.example.TaipeiBus
          fi
          mkdir -p "$RUNNER_TEMP/phone-screenshots"
          if [ '${{ inputs.preview_scope }}' != 'all' ]; then
            sim location "$device" set 25.0377,121.56
            sim privacy "$device" grant location com.example.TaipeiBus
          fi
          if [ '${{ inputs.preview_scope }}' = 'all' ] || [ '${{ inputs.preview_scope }}' = 'routes' ]; then
          launch_ready --preview-route-search ''
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-all-routes.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-route-search '幹線'
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-trunk-route-search.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-route 307 --preview-details
          sleep 6
          wait_route_map_ready iPhone17-route-variants
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-route-variants.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-route '紅5往陽明山' --preview-details
          sleep 6
          wait_route_map_ready iPhone17-one-way-variant
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-one-way-variant.png"
          sim terminate "$device" com.example.TaipeiBus
          fi
          if [ '${{ inputs.preview_scope }}' = 'navigation' ]; then
          for group in transit landmarks addresses expanded; do
          launch_ready --preview-place-audit --preview-audit-group "$group"
          python3 - "$container/Documents/place-search-audit.json" "$token" "$RUNNER_TEMP/phone-screenshots/place-search-$group.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          Path(sys.argv[3]).write_text(json.dumps(data, ensure_ascii=False, indent=2))
          assert data['token'] == sys.argv[2] and not data['error'], data
          targets = {
              '內湖站': (25.08,25.09,121.59,121.60), '内湖站': (25.08,25.09,121.59,121.60),
              '台北 內湖站': (25.08,25.09,121.59,121.60),
              '內湖捷運站': (25.08,25.09,121.59,121.60), '我要去內湖站': (25.08,25.09,121.59,121.60),
              'Neihu Station': (25.08,25.09,121.59,121.60), '七張站': (24.975,24.985,121.535,121.545),
              '南港展覽館站': (25.05,25.06,121.61,121.625), '東湖站': (25.06,25.075,121.60,121.625),
              '港墘站': (25.075,25.085,121.57,121.585), '西門站': (25.038,25.047,121.503,121.514),
              '臺北車站': (25.042,25.052,121.51,121.525), '臺北101': (25.03,25.038,121.56,121.57),
              '台大': (25.008,25.025,121.528,121.552), '三總': (25.065,25.08,121.58,121.605),
              '小巨蛋': (25.046,25.058,121.542,121.558), '忠孝東路四段100號': (25.035,25.05,121.535,121.56)}
          for row in data['results']:
              assert row['places'], row
              south,north,west,east = targets[row['query']]
              assert any(south < place['latitude'] < north and west < place['longitude'] < east for place in row['places']), row
              if row['query'] == '內湖站':
                  assert row['stations'] and all(name.startswith('捷運內湖站') for name in row['stations']), row
          print('Native place searches verified:', data['group'], ', '.join(row['query'] for row in data['results']))
          PY
          sim terminate "$device" com.example.TaipeiBus
          done
          launch_ready --preview-journey-search --preview-search-query '內湖站'
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-neihu-search.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-boarding-fixture
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-boarding-three-vehicles-fixture.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-boarding-fixture --preview-track-next
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-track-next-fixture.png"
          sim terminate "$device" com.example.TaipeiBus
          fi
          if [ '${{ inputs.preview_scope }}' = 'live-settings' ]; then
          launch_ready --preview-live-update --preview-journey-search --preview-search-query '內湖月台'
          fi
          if [ '${{ inputs.preview_scope }}' != 'routes' ] && [ '${{ inputs.preview_scope }}' != 'navigation' ] && [ '${{ inputs.preview_scope }}' != 'live-settings' ] && [ '${{ inputs.preview_scope }}' != 'usability' ]; then
          if [ '${{ inputs.preview_scope }}' != 'journey-layout' ]; then
          launch_ready
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-destination-home.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-journey-search
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-destination-search.png"
          sim terminate "$device" com.example.TaipeiBus
          fi
          launch_ready --preview-destination '臺北車站'
          sleep 6
          wait_route_map_ready iPhone17-journey-options
          verify_journey_ready iPhone17-journey-options planning
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-journey-options.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-destination '臺北車站' --preview-journey-expanded
          sleep 6
          wait_route_map_ready iPhone17-journey-expanded
          verify_journey_ready iPhone17-journey-expanded planning
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-journey-expanded.png"
          sim terminate "$device" com.example.TaipeiBus
          if [ '${{ inputs.preview_scope }}' != 'journey-layout' ]; then
          launch_ready --preview-destination '臺北車站' --preview-journey-start
          sleep 6
          wait_route_map_ready iPhone17-journey-walking
          verify_journey_ready iPhone17-journey-walking walking
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-journey-walking.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-destination '臺北車站' --preview-journey-start --preview-journey-step 1
          sleep 6
          wait_route_map_ready iPhone17-journey-bus
          verify_journey_ready iPhone17-journey-bus riding
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-journey-bus.png"
          sim terminate "$device" com.example.TaipeiBus
          sim privacy "$device" revoke location com.example.TaipeiBus
          launch_ready --preview-destination '臺北車站' --preview-origin-station 6922
          sleep 6
          wait_route_map_ready iPhone17-journey-manual-origin
          verify_journey_ready iPhone17-journey-manual-origin planning
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-journey-manual-origin.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-route 307 --preview-details
          sleep 6
          wait_route_map_ready iPhone17-compact-route
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-compact-route.png"
          sim terminate "$device" com.example.TaipeiBus
          fi
          fi
          if [ '${{ inputs.preview_scope }}' = 'all' ]; then
          launch_ready --preview-route 284 --preview-details
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-route-quick-query.png"
          sim terminate "$device" com.example.TaipeiBus
          # Finish the functional screenshots before recording so a recorder failure cannot hide them.
          launch_ready --preview-vehicle-route 284
          sleep 6
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-follow-start.png"
          sleep 32
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-vehicle-later.png"
          fi
      - name: Tap through native user journeys
        if: github.event_name == 'workflow_dispatch' && inputs.capture_preview && inputs.preview_scope == 'usability' && inputs.usability_scope != 'routing-only'
        run: |
          set -euo pipefail
          gem install xcodeproj -v 1.27.0 --no-document --user-install
          ruby ios/usability/setup.rb
          xcrun simctl privacy "$BUS_SIM_DEVICE" grant location com.example.TaipeiBus
          selection=('-skip-testing:TaipeiBusUsabilityTests/NoLocationUsabilityTests')
          if [ '${{ inputs.usability_scope }}' = 'map-controls' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/MapAndSearchUsabilityTests')
          fi
          if [ '${{ inputs.usability_scope }}' = 'journey-selection' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/JourneyUsabilityTests/testSearchCompareCancelAndReturnFromWalkingMap')
          fi
          if [ '${{ inputs.usability_scope }}' = 'app-store' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/AppStoreScreenshotTests')
          fi
          if [ '${{ inputs.usability_scope }}' = 'city-fleet' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/CityFleetUsabilityTests')
          fi
          if [ '${{ inputs.usability_scope }}' = 'navigation-appearance' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/AppearanceUsabilityTests')
            xcrun simctl ui "$BUS_SIM_DEVICE" appearance light
          fi
          if [ '${{ inputs.usability_scope }}' = 'continuous-gps' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/ContinuousGpsUsabilityTests'
              '-only-testing:TaipeiBusUsabilityTests/CityFleetUsabilityTests/testDenseFleetZoomTrackingAndReturn'
              '-only-testing:TaipeiBusUsabilityTests/AppearanceUsabilityTests/testInterchangeableVehicleTrackingAndOnboardFlow')
            xcrun simctl ui "$BUS_SIM_DEVICE" appearance light
          fi
          if [ '${{ inputs.usability_scope }}' = 'navigation-optimization' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/NavigationOptimizationUsabilityTests'
              '-only-testing:TaipeiBusUsabilityTests/JourneyUsabilityTests/testWaitingTrackingAndCompleteTrip'
              '-only-testing:TaipeiBusUsabilityTests/JourneyUsabilityTests/testTransferShowsTheNextBus'
              '-only-testing:TaipeiBusUsabilityTests/JourneyUsabilityTests/testSearchCompareCancelAndReturnFromWalkingMap'
              '-only-testing:TaipeiBusUsabilityTests/JourneyUsabilityTests/testLargerTextKeepsTheMainActionsVisible')
            xcrun simctl ui "$BUS_SIM_DEVICE" appearance light
          fi
          if [ '${{ inputs.usability_scope }}' = 'navigation-details' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/NavigationOptimizationUsabilityTests'
              '-only-testing:TaipeiBusUsabilityTests/JourneyUsabilityTests/testTransferShowsTheNextBus')
            xcrun simctl ui "$BUS_SIM_DEVICE" appearance light
          fi
          if [ '${{ inputs.usability_scope }}' = 'navigation-onboard' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/NavigationOptimizationUsabilityTests/testBoardingUsesRemainingTravelAndPreservesTheConfirmedPlate'
              '-only-testing:TaipeiBusUsabilityTests/AppearanceUsabilityTests/testInterchangeableVehicleTrackingAndOnboardFlow')
            xcrun simctl ui "$BUS_SIM_DEVICE" appearance light
          fi
          if [ '${{ inputs.usability_scope }}' = 'english-mode' ] || [ '${{ inputs.usability_scope }}' = 'english-motion' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/EnglishModeUsabilityTests'
              '-only-testing:TaipeiBusUsabilityTests/JourneyUsabilityTests/testWaitingTrackingAndCompleteTrip')
            xcrun simctl ui "$BUS_SIM_DEVICE" appearance light
          fi
          if [ '${{ inputs.usability_scope }}' = 'english-motion' ]; then
            selection=('-only-testing:TaipeiBusUsabilityTests/EnglishModeUsabilityTests/testEnglishBoardingWithoutSelectedPlateKeepsChineseAlightingName')
          fi
          if [ '${{ inputs.usability_scope }}' = 'english-final' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/EnglishModeUsabilityTests/testEnglishBrowsingShowsOfficialTimesWithBilingualStops'
              '-only-testing:TaipeiBusUsabilityTests/EnglishModeUsabilityTests/testEnglishNavigationHasAlightingTimeAndStopCount'
