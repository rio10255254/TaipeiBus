name: iPhone app

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      sign_ipa:
        description: 'Also export a signed IPA using configured Apple secrets'
        type: boolean
        default: false
      publish_testflight:
        description: 'Sign and upload directly to TestFlight using configured Apple secrets'
        type: boolean
        default: false
      bundle_id:
        description: 'Existing app Bundle ID (required for signed IPA)'
        type: string
        default: 'com.rio10255254.TaipeiBus'
      export_method:
        description: 'Signed IPA distribution method'
        type: choice
        options: ['release-testing', 'debugging', 'app-store-connect']
        default: 'release-testing'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and core tests
        run: |
          xcodebuild -version
          swift test --package-path ios/TransitCore
          ruby -c ios/apple-connect.rb
      - name: Build native app
        run: |
          set -o pipefail
          xcodebuild -project ios/TaipeiBus.xcodeproj -scheme TaipeiBus \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/BusBuild" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/ios-build.log"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/BusBuild/Build/Products/Debug-iphonesimulator/TaipeiBus.app" \
            "$RUNNER_TEMP/TaipeiBus-simulator.app.zip"
      - name: Compile release app for iPhone
        run: |
          set -o pipefail
          xcodebuild -project ios/TaipeiBus.xcodeproj -scheme TaipeiBus \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BusBuild" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/ios-release-build.log"
      - name: iPhone 17 launch and screenshots
        timeout-minutes: 12
        run: |
          set -euo pipefail
          simctl=$(xcrun --find simctl)
          # Bound simulator RPCs and print the active command before it starts.
          sim() {
            python3 - "$simctl" "$@" <<'PY'
          import subprocess, sys
          command = sys.argv[1:]
          print('Simulator command:', ' '.join(command[1:]), file=sys.stderr, flush=True)
          timeout = 180 if command[1] in ('bootstatus', 'install', 'launch') else 60
          subprocess.run(command, check=True, timeout=timeout)
          PY
          }
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; a=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and "iOS" in x["name"]]; print(sorted(a,key=lambda x:tuple(map(int,x["version"].split("."))))[-1]["identifier"])')
          device=$(xcrun simctl create TaipeiBus-iPhone17 com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")
          echo "BUS_SIM_DEVICE=$device" >> "$GITHUB_ENV"
          sim boot "$device"
          sim bootstatus "$device" -b
          python3 - "$DEVELOPER_DIR/Applications/Simulator.app" "$device" <<'PY'
          import subprocess, sys
          subprocess.run(['open', '-a', sys.argv[1], '--args', '-CurrentDeviceUDID', sys.argv[2]], check=True, timeout=30)
          PY
          sim install "$device" "$RUNNER_TEMP/BusBuild/Build/Products/Debug-iphonesimulator/TaipeiBus.app"
          sim status_bar "$device" override --time '9:41' --batteryState charged --batteryLevel 100
          container=$(sim get_app_container "$device" com.example.TaipeiBus data)
          launch_ready() {
            token="$RANDOM-$RANDOM"
            sim launch "$device" com.example.TaipeiBus --preview-capture "$token" "$@"
            python3 - "$container/Documents/transit-preview-ready" "$token" <<'PY'
          import sys, time
          from pathlib import Path
          marker = Path(sys.argv[1])
          deadline = time.monotonic() + 90
          while not marker.exists() or marker.read_text() != sys.argv[2]:
              if time.monotonic() > deadline:
                  raise RuntimeError('Live-data preview did not reach its requested state.')
              time.sleep(1)
          print('Requested live-data preview is ready.', flush=True)
          PY
          }
          launch_ready
          sleep 40
          mkdir -p "$RUNNER_TEMP/phone-screenshots"
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-home.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-station 6922
          sleep 15
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-station.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-vehicle-route 284
          sleep 15
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-vehicle.png"
          sim terminate "$device" com.example.TaipeiBus
          # Location is simulated here; vehicle GPS and ETAs still come from the public live feeds.
          sim location "$device" set 25.0377,121.56
          sim privacy "$device" grant location com.example.TaipeiBus
          launch_ready
          sleep 12
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-nearby.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-station 6922 --preview-details
          sleep 12
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-station-details.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-vehicle-route 284 --preview-details
          sleep 12
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-vehicle-details.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-route 284
          sleep 12
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-route.png"
          sim terminate "$device" com.example.TaipeiBus
          launch_ready --preview-search EAA207
          sleep 12
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-plate-search.png"
          sim terminate "$device" com.example.TaipeiBus
          # Finish the functional screenshots before recording so a recorder failure cannot hide them.
          launch_ready --preview-vehicle-route 284
          sleep 15
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-follow-start.png"
          sleep 32
          sim io "$device" screenshot "$RUNNER_TEMP/phone-screenshots/iPhone17-vehicle-later.png"
      - name: Record optional native preview
        # Recording is a preview artifact; it must not gate native checks or signing.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -euo pipefail
          trap 'if [ "$?" -ne 0 ]; then rm -f "$RUNNER_TEMP/iPhone17-live-follow.mp4"; fi' EXIT
          device="$BUS_SIM_DEVICE"
          BUS_SIM_DEVICE="$device" python3 - <<'PY'
          import os, signal, subprocess, time
          from pathlib import Path
          output = os.path.join(os.environ['RUNNER_TEMP'], 'iPhone17-live-follow.mp4')
          log_path = Path(os.environ['RUNNER_TEMP']) / 'video-record.log'
          simctl = subprocess.check_output(['xcrun', '--find', 'simctl'], text=True).strip()
          with log_path.open('w') as log:
              process = subprocess.Popen([simctl, 'io', os.environ['BUS_SIM_DEVICE'],
                  'recordVideo', '--codec=h264', output], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  deadline = time.monotonic() + 60
                  while 'Recording started' not in log_path.read_text(errors='replace'):
                      if process.poll() is not None or time.monotonic() > deadline:
                          raise RuntimeError('Simulator recorder did not become ready.')
                      time.sleep(0.25)
                  print(f'Recorder ready, actual simctl PID {process.pid}', flush=True)
                  time.sleep(32)
                  # Stop the actual simctl after its first frame, giving AVAssetWriter time to flush.
                  process.send_signal(signal.SIGINT)
                  try:
                      process.wait(timeout=60)
                  except subprocess.TimeoutExpired:
                      process.send_signal(signal.SIGINT)
                      process.wait(timeout=30)
                  if process.returncode != 0:
                      raise RuntimeError(f'Simulator recording failed: {process.returncode}')
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=5)
          PY
          cat > "$RUNNER_TEMP/verify-video.swift" <<'SWIFT'
          import Foundation
          import AVFoundation
          let path = ProcessInfo.processInfo.environment["RUNNER_TEMP"]! + "/iPhone17-live-follow.mp4"
          let duration = try await AVURLAsset(url: URL(fileURLWithPath: path)).load(.duration)
          let seconds = CMTimeGetSeconds(duration)
          guard seconds.isFinite, seconds >= 20, seconds <= 65 else { fatalError("Invalid video duration: \(seconds)") }
          print("Native recording verified: \(seconds) seconds")
          SWIFT
          swift "$RUNNER_TEMP/verify-video.swift"
      - name: Collect runtime diagnostics and stop simulator
        if: always() && env.BUS_SIM_DEVICE != ''
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          simctl = subprocess.check_output(['xcrun', '--find', 'simctl'], text=True).strip()
          device = os.environ['BUS_SIM_DEVICE']
          with (Path(os.environ['RUNNER_TEMP']) / 'ios-runtime.log').open('w') as log:
              try:
                  subprocess.run([simctl, 'spawn', device, 'log', 'show', '--style', 'compact',
                      '--last', '8m', '--predicate', 'process == "TaipeiBus"'], stdout=log,
                      stderr=subprocess.STDOUT, timeout=60)
              except subprocess.TimeoutExpired:
                  log.write('\nRuntime log query timed out.\n')
          try:
              subprocess.run([simctl, 'shutdown', device], timeout=60)
          except subprocess.TimeoutExpired:
              print('Simulator shutdown timed out.', flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone17-simulator
          path: |
            ${{ runner.temp }}/TaipeiBus-simulator.app.zip
            ${{ runner.temp }}/phone-screenshots
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-release-build.log
            ${{ runner.temp }}/ios-runtime.log
            ${{ runner.temp }}/iPhone17-live-follow.mp4
            ${{ runner.temp }}/video-record.log
          retention-days: 7

  signed-ipa:
    if: github.event_name == 'workflow_dispatch' && (inputs.sign_ipa || inputs.publish_testflight)
    needs: simulator
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUS_BUNDLE_ID: ${{ inputs.bundle_id }}
      BUS_EXPORT_METHOD: ${{ inputs.export_method }}
      BUS_PUBLISH_TESTFLIGHT: ${{ inputs.publish_testflight }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare automatic signing
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY"
          test "$BUS_BUNDLE_ID" != com.example.TaipeiBus
          mkdir -p "$RUNNER_TEMP/bus-signing"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/bus-signing/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/bus-signing/AuthKey.p8"
          python3 - <<'PY'
          import os, plistlib
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'bus-signing/ExportOptions.plist'), 'wb') as f:
              publish = os.environ['BUS_PUBLISH_TESTFLIGHT'] == 'true'
              plistlib.dump({'method': 'app-store-connect' if publish else os.environ['BUS_EXPORT_METHOD'],
                             'teamID': os.environ['APPLE_TEAM_ID'], 'signingStyle': 'automatic',
                             'destination': 'upload' if publish else 'export',
                             'manageAppVersionAndBuildNumber': True}, f)
          PY
      - name: Verify App Store Connect app record
        if: inputs.publish_testflight
        run: ruby ios/apple-connect.rb preflight
      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -project ios/TaipeiBus.xcodeproj -scheme TaipeiBus \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TaipeiBus.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/bus-signing/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUS_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
          date +%s > "$RUNNER_TEMP/bus-signing/upload-start"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TaipeiBus.xcarchive" \
            -exportPath "$RUNNER_TEMP/BusIPA" \
            -exportOptionsPlist "$RUNNER_TEMP/bus-signing/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/bus-signing/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Confirm TestFlight processing
        if: inputs.publish_testflight
        run: ruby ios/apple-connect.rb processing
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish_testflight }}
        with:
          name: TaipeiBus-signed-IPA
          path: ${{ runner.temp }}/BusIPA/*.ipa
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/bus-signing/AuthKey.p8"
