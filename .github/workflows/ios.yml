      - name: Export native walkthrough screenshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.preview_scope == 'usability'
        run: |
          if [ -d "$RUNNER_TEMP/usability-motion.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/usability-motion.xcresult" \
              --output-path "$RUNNER_TEMP/usability-motion-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/usability.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/usability.xcresult" \
              --output-path "$RUNNER_TEMP/usability-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/usability-no-location.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/usability-no-location.xcresult" \
              --output-path "$RUNNER_TEMP/usability-no-location-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/usability-dark.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/usability-dark.xcresult" \
              --output-path "$RUNNER_TEMP/usability-dark-screenshots"
          fi
          python3 - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          names = set(re.findall(r'capture\("([^"]+)"\)', Path('ios/usability/JourneyUsabilityTests.swift').read_text()))
          for folder in ['usability-screenshots', 'usability-no-location-screenshots', 'usability-dark-screenshots']:
              manifest = root / folder / 'manifest.json'
              if not manifest.exists():
                  continue
              target = root / 'usability-preview' / folder
              target.mkdir(parents=True, exist_ok=True)
              records = json.loads(manifest.read_text())
              for record in records:
                  keep = []
                  for item in record.get('attachments', []):
                      label = item.get('suggestedHumanReadableName', '')
                      if item.get('isAssociatedWithFailure') or label.startswith(('city-', 'appearance-', 'continuous-', 'navigation-')) or any(label.startswith(name) for name in names):
                          filename = Path(item['exportedFileName']).name
                          shutil.copyfile(manifest.parent / filename, target / filename)
                          keep.append(item)
                  record['attachments'] = keep
              (target / 'manifest.json').write_text(json.dumps(records))
          PY
      - name: Capture live content before update
        if: github.event_name == 'workflow_dispatch' && inputs.capture_preview && inputs.preview_scope == 'live-settings'
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          device = os.environ['BUS_SIM_DEVICE']
          container = Path(subprocess.check_output(['xcrun', 'simctl', 'get_app_container', device, 'com.example.TaipeiBus', 'data'], text=True).strip())
          marker = container / 'Documents/live-settings-state.json'
          output = Path(os.environ['RUNNER_TEMP']) / 'phone-screenshots'
          deadline = time.monotonic() + 100
          while time.monotonic() < deadline:
              try:
                  state = json.loads(marker.read_text())
                  if state['content_revision'] == int(os.environ['BUS_CONTENT_BEFORE']) and state['location_ready']:
                      assert state['version'] == json.loads(Path('ios/release/testflight.json').read_text())['version'], state
                      assert 0 <= state['first_location_milliseconds'] < 15000, state
                      (output / 'live-update-before.json').write_text(json.dumps(state, ensure_ascii=False, indent=2))
                      time.sleep(2)
                      subprocess.run(['xcrun', 'simctl', 'io', device, 'screenshot', str(output / 'iPhone17-live-update-before.png')], check=True, timeout=60)
                      print('BEFORE_LIVE_UPDATE_READY: same process will remain running.', flush=True)
                      break
              except (OSError, ValueError, KeyError):
                  pass
              time.sleep(1)
          else:
              raise RuntimeError('Initial location/content state did not become ready.')
          PY
      - name: Verify live update without rebuilding or reinstalling
        if: github.event_name == 'workflow_dispatch' && inputs.capture_preview && inputs.preview_scope == 'live-settings'
        timeout-minutes: 11
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          device = os.environ['BUS_SIM_DEVICE']
          container = Path(subprocess.check_output(['xcrun', 'simctl', 'get_app_container', device, 'com.example.TaipeiBus', 'data'], text=True).strip())
          marker = container / 'Documents/live-settings-state.json'
          output = Path(os.environ['RUNNER_TEMP']) / 'phone-screenshots'
          before = json.loads((output / 'live-update-before.json').read_text())
          deadline = time.monotonic() + 600
          while time.monotonic() < deadline:
              try:
                  state = json.loads(marker.read_text())
                  if state['content_revision'] == int(os.environ['BUS_CONTENT_AFTER']):
                      assert state['pid'] == before['pid'] and state['token'] == before['token'], state
                      assert state['version'] == before['version'] and state['accent'] == '#A83B80', state
                      assert state['station_label'] == '候車站牌' and state['alias_stations'], state
                      assert all(row['name'].startswith('捷運內湖站') for row in state['alias_stations']), state
                      (output / 'live-update-after.json').write_text(json.dumps(state, ensure_ascii=False, indent=2))
                      time.sleep(3)
                      subprocess.run(['xcrun', 'simctl', 'io', device, 'screenshot', str(output / 'iPhone17-live-update-after.png')], check=True, timeout=60)
                      print('Real HTTPS content update verified on the same app process and version.', flush=True)
                      break
              except (OSError, ValueError, KeyError):
                  pass
              time.sleep(2)
          else:
              raise RuntimeError('Published revision 2 was not received by the running app.')
          PY
      - name: Record optional native preview
        if: github.event_name == 'workflow_dispatch' && inputs.capture_preview && inputs.preview_scope == 'all'
        # Recording is a preview artifact; it must not gate native checks or signing.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -euo pipefail
          trap 'if [ "$?" -ne 0 ]; then rm -f "$RUNNER_TEMP/iPhone17-live-follow.mp4"; fi' EXIT
          device="$BUS_SIM_DEVICE"
          BUS_SIM_DEVICE="$device" python3 - <<'PY'
          import os, signal, subprocess, time
          from pathlib import Path
          output = os.path.join(os.environ['RUNNER_TEMP'], 'iPhone17-live-follow.mp4')
          log_path = Path(os.environ['RUNNER_TEMP']) / 'video-record.log'
          simctl = subprocess.check_output(['xcrun', '--find', 'simctl'], text=True).strip()
          with log_path.open('w') as log:
              process = subprocess.Popen([simctl, 'io', os.environ['BUS_SIM_DEVICE'],
                  'recordVideo', '--codec=h264', output], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  deadline = time.monotonic() + 60
                  while 'Recording started' not in log_path.read_text(errors='replace'):
                      if process.poll() is not None or time.monotonic() > deadline:
                          raise RuntimeError('Simulator recorder did not become ready.')
                      time.sleep(0.25)
                  print(f'Recorder ready, actual simctl PID {process.pid}', flush=True)
                  time.sleep(32)
                  # Stop the actual simctl after its first frame, giving AVAssetWriter time to flush.
                  process.send_signal(signal.SIGINT)
                  try:
                      process.wait(timeout=60)
                  except subprocess.TimeoutExpired:
                      process.send_signal(signal.SIGINT)
                      process.wait(timeout=30)
                  if process.returncode != 0:
                      raise RuntimeError(f'Simulator recording failed: {process.returncode}')
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=5)
          PY
          cat > "$RUNNER_TEMP/verify-video.swift" <<'SWIFT'
          import Foundation
          import AVFoundation
          let path = ProcessInfo.processInfo.environment["RUNNER_TEMP"]! + "/iPhone17-live-follow.mp4"
          let duration = try await AVURLAsset(url: URL(fileURLWithPath: path)).load(.duration)
          let seconds = CMTimeGetSeconds(duration)
          guard seconds.isFinite, seconds >= 20, seconds <= 65 else { fatalError("Invalid video duration: \(seconds)") }
          print("Native recording verified: \(seconds) seconds")
          SWIFT
          swift "$RUNNER_TEMP/verify-video.swift"
      - name: Collect runtime diagnostics and stop simulator
        if: always() && env.BUS_SIM_DEVICE != ''
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          simctl = subprocess.check_output(['xcrun', '--find', 'simctl'], text=True).strip()
          device = os.environ['BUS_SIM_DEVICE']
          with (Path(os.environ['RUNNER_TEMP']) / 'ios-runtime.log').open('w') as log:
              try:
                  subprocess.run([simctl, 'spawn', device, 'log', 'show', '--style', 'compact',
                      '--last', '8m', '--predicate', 'process == "TaipeiBus"'], stdout=log,
                      stderr=subprocess.STDOUT, timeout=60)
              except subprocess.TimeoutExpired:
                  log.write('\nRuntime log query timed out.\n')
          try:
              subprocess.run([simctl, 'shutdown', device], timeout=60)
          except subprocess.TimeoutExpired:
              print('Simulator shutdown timed out.', flush=True)
          PY
