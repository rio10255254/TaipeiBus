            xcrun simctl ui "$BUS_SIM_DEVICE" appearance light
          fi
          if [ '${{ inputs.usability_scope }}' = 'app-store-3d' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/AppStoreScreenshotTests/testStoreLiveBusIn3D')
            export TEST_RUNNER_BUS_STORE_VEHICLE_ROUTE=__live__
          fi
          if [ '${{ inputs.usability_scope }}' = 'app-store-features' ]; then
            selection+=('-only-testing:TaipeiBusUsabilityTests/AppStoreScreenshotTests/testStoreLiveBusIn3D'
              '-only-testing:TaipeiBusUsabilityTests/AppStoreScreenshotTests/testStoreRealDestinationAndItinerary')
            # Pick a currently moving public-feed bus near buildings in Taipei.
            # Only simulator passenger location is controlled; bus GPS/ETAs remain live.
            export BUS_STORE_VEHICLE_ROUTE=$(python3 - <<'PY'
          import concurrent.futures, gzip, json, math
          from urllib.request import urlopen
          def fetch(name):
              raw = urlopen(f'https://tcgbusfs.blob.core.windows.net/blobbus/{name}.gz', timeout=30).read()
              return json.loads(gzip.decompress(raw))['BusInfo']
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              vehicles, routes = list(pool.map(fetch, ['GetBusData', 'GetRoute']))
          catalog = {str(route['pathAttributeId']): route for route in routes}
          choices = []
          for bus in vehicles:
              route = catalog.get(str(bus.get('RouteID')))
              if not route or str(bus.get('DutyStatus')) != '1' or float(bus.get('Speed') or 0) < 8:
                  continue
              lat, lon = float(bus['Latitude']), float(bus['Longitude'])
              if not (25.025 < lat < 25.07 and 121.53 < lon < 121.59):
                  continue
              distance = math.hypot(lat - 25.038, (lon - 121.56) * 0.9)
              choices.append((distance, route['nameZh']))
          if not choices:
              raise RuntimeError('No actual moving city-centre bus is available for this capture.')
          print(min(choices)[1])
          PY
            )
            test -n "$BUS_STORE_VEHICLE_ROUTE"
            export TEST_RUNNER_BUS_STORE_VEHICLE_ROUTE="$BUS_STORE_VEHICLE_ROUTE"
          fi
          recorder=()
          if [ '${{ inputs.usability_scope }}' = 'english-motion' ]; then recorder=(python3 ios/usability/record-run.py); fi
          "${recorder[@]}" xcodebuild -project ios/TaipeiBus.xcodeproj -scheme TaipeiBusUsability \
            -configuration Debug -destination "platform=iOS Simulator,id=$BUS_SIM_DEVICE" \
