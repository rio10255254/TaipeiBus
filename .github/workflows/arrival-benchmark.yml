name: Arrival benchmark recording
# Two weeks of Taipei's and New Taipei's public bus positions and official arrival estimates,
# so every prediction method can be replayed against actual stop passages. Each run records
# for just under six hours and queues the next one itself until BENCHMARK_UNTIL; New Taipei's
# feeds go to ntpc/ inside the same recording. Taipei alone was recorded 2026-10-14..28.
# After BENCHMARK_UNTIL it only starts by hand: set a new BENCHMARK_UNTIL and run it to
# record another period. Public data only; no TDX quota.
on:
  workflow_dispatch:
    inputs:
      chained:
        description: 'Started by the previous recording (set automatically)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: arrival-benchmark
  cancel-in-progress: false
env:
  BENCHMARK_UNTIL: '2026-11-14T00:00:00+08:00'
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      # Queued first, so a failed recording does not end the series. The concurrency group
      # holds it until this run finishes; a manually dispatched run is allowed to trigger runs.
      - name: Queue the next recording
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%s)" -lt "$(date -d "$BENCHMARK_UNTIL" +%s)" ]; then
            gh workflow run arrival-benchmark.yml --ref main -f chained=true
          else
            echo 'Benchmark period is over; not queuing another recording.'
          fi
      - name: Test the recorder
        run: cd tools/arrival-benchmark && python3 collect_test.py
      - name: Record public feeds
        run: |
          set -euo pipefail
          flags=()
          # Route, stop and shape feeds about once a day: automatic runs record them only when
          # they start between 08:00 and 14:00 Taipei; a manual start always records them.
          automatic=${{ github.event_name == 'schedule' || inputs.chained }}
          if [ "$automatic" = true ] && [ "$(date -u +%H)" -ge 6 ]; then flags+=(--no-static); fi
          # Both cities at once, each polling on its own; the step fails if either does, after both end.
          # New Taipei keeps whole sampled routes, so the countdown's estimate-difference segments can be scored.
          python3 tools/arrival-benchmark/collect.py --out "$RUNNER_TEMP/benchmark/ntpc" --city ntpc --sample route --minutes 345 "${flags[@]}" &
          ntpc=$!
          taipei=0
          python3 tools/arrival-benchmark/collect.py --out "$RUNNER_TEMP/benchmark" --city tpe --minutes 345 "${flags[@]}" || taipei=$?
          wait "$ntpc"
          exit "$taipei"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arrival-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmark/
          retention-days: 90
          if-no-files-found: ignore
          compression-level: 0
