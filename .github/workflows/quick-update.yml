name: Quick update content

on:
  push:
    branches: ['main']
    paths: ['runtime/**', 'ios/live-update.py', '.github/workflows/quick-update.yml']
  pull_request:
    paths: ['runtime/**', 'ios/live-update.py', '.github/workflows/quick-update.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate current content, publish changes, or restore earlier content'
        type: choice
        options: ['validate', 'publish', 'rollback']
        default: 'validate'
      document:
        description: 'For publish: full JSON or a partial update (no secrets)'
        type: string
        default: ''
      restore_revision:
        description: 'For rollback: previous content revision to restore'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: live-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate downloaded content
        run: python3 ios/live-update.py validate runtime/settings.json
      - name: Refresh the CDN copy phones use when GitHub is unreachable
        if: github.event_name == 'push'
        run: ./.github/purge-runtime-mirror.sh
      - name: Validate the update switch against the App Store
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          policy = json.load(open('runtime/app-update.json', encoding='utf-8'))
          version = re.compile(r'\d{1,4}(\.\d{1,4}){0,3}')
          assert set(policy) <= {'schemaVersion', 'minimumVersion', 'recommendedVersion', 'message', 'englishMessage'}, 'unknown field'
          assert policy.get('schemaVersion') == 1 and version.fullmatch(policy.get('minimumVersion', '')), 'schema or minimumVersion'
          assert 'recommendedVersion' not in policy or version.fullmatch(policy['recommendedVersion']), 'recommendedVersion'
          assert all(0 < len(policy.get(k, 'x')) <= 300 for k in ('message', 'englishMessage')), 'message length'
          parts = lambda text: [int(x) for x in text.split('.')] + [0] * (4 - text.count('.') - 1)
          with urllib.request.urlopen('https://itunes.apple.com/lookup?id=6818475740&country=tw', timeout=30) as response:
              live = json.load(response)['results'][0]['version']
          for key in ('minimumVersion', 'recommendedVersion'):
              if key in policy and parts(policy[key]) > parts(live):
                  print(f'::warning::{key} {policy[key]} is above the App Store version {live}; phones ignore it until that version is live.')
          print(f'Update switch valid; App Store (Taiwan) version {live}.')
          PY
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'validate' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUS_LIVE_DOCUMENT: ${{ inputs.document }}
      BUS_RESTORE_REVISION: ${{ inputs.restore_revision }}
      BUS_LIVE_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish validated content or restore earlier content
        run: |
          python3 - <<'PY'
          import os, subprocess
          if os.environ['BUS_LIVE_OPERATION'] == 'publish':
              command = ['python3', 'ios/live-update.py', 'publish']
          else:
              value = os.environ['BUS_RESTORE_REVISION']
              if not value.isdecimal() or int(value) <= 0:
                  raise SystemExit('Specify the earlier positive content revision to restore.')
              command = ['python3', 'ios/live-update.py', 'rollback', value]
          subprocess.run(command, check=True)
          PY
      # A push made with the workflow token starts no other workflow, so purge here as well.
      - name: Refresh the CDN copy phones use when GitHub is unreachable
        run: ./.github/purge-runtime-mirror.sh
