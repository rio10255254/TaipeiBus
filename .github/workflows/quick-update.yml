name: Quick update content

on:
  push:
    branches: ['main']
    paths: ['runtime/**', 'ios/live-update.py', '.github/workflows/quick-update.yml']
  pull_request:
    paths: ['runtime/**', 'ios/live-update.py', '.github/workflows/quick-update.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate current content, publish changes, or restore earlier content'
        type: choice
        options: ['validate', 'publish', 'rollback']
        default: 'validate'
      cycling_probe:
        description: 'Collect diagnostic cycling responses across iOS generations'
        type: boolean
        default: false
      document:
        description: 'For publish: full JSON or a partial update (no secrets)'
        type: string
        default: ''
      restore_revision:
        description: 'For rollback: previous content revision to restore'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: live-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cycling_source_probe:
    if: github.event_name == 'workflow_dispatch' && inputs.cycling_probe
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            developer: /Applications/Xcode_26.3.app/Contents/Developer
          - runner: macos-26
            developer: /Applications/Xcode.app/Contents/Developer
          - runner: xcode-27
            developer: /Applications/Xcode.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
    steps:
      - uses: actions/checkout@v4
      - name: Query the actual iPhone cycling source independently of app geometry
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Probe.app"
          xcrun swiftc -parse-as-library -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios17.0-simulator ios/release/cycling-source-check.swift -o "$RUNNER_TEMP/Probe.app/Probe"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.example.TaipeiBus.CyclingProbe' "$RUNNER_TEMP/Probe.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string Probe' "$RUNNER_TEMP/Probe.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$RUNNER_TEMP/Probe.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$RUNNER_TEMP/Probe.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :UIApplicationSceneManifest dict' "$RUNNER_TEMP/Probe.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false' "$RUNNER_TEMP/Probe.app/Info.plist"
          codesign -s - "$RUNNER_TEMP/Probe.app"
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; a=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and "iOS" in x["name"]]; print(sorted(a,key=lambda x:tuple(map(int,x["version"].split("."))))[-1]["identifier"])')
          device=$(xcrun simctl create TaipeiBus-cycling-probe com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/Probe.app"
          xcrun simctl launch --console "$device" com.example.TaipeiBus.CyclingProbe | tee "$RUNNER_TEMP/cycling-source.log"
          python3 -c 'import os; p=os.environ["RUNNER_TEMP"]+"/cycling-source.log"; s=open(p).read(); assert all(x in s for x in ["OS=","SOURCE=Taipei cycling","SOURCE=Taipei driving","SOURCE=Taipei walking","SOURCE=Apple sample cycling"]), "Probe must actually execute all queries"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycling-source-${{ matrix.runner }}
          path: ${{ runner.temp }}/cycling-source.log
  legacy_compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.2.0'
            commit: bb7bc0ae1a3d622190060700191afa25a419dc24
          - version: '1.8.0'
            commit: 6ca91b401086da111b5dd8116658092dc5134260
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEGACY_APP_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test current quick-update settings on the released decoder
        run: |
          set -euo pipefail
          cp runtime/settings.json "$RUNNER_TEMP/settings-1.8.1.json"
          git fetch --depth=1 origin ${{ matrix.commit }}
          mkdir -p "$RUNNER_TEMP/legacy-180"
          git archive FETCH_HEAD ios/TransitCore | tar -x -C "$RUNNER_TEMP/legacy-180"
          cat > "$RUNNER_TEMP/legacy-180/ios/TransitCore/Tests/TransitCoreTests/AuditCompatibilityTests.swift" <<'SWIFT'
          import XCTest
          @testable import TransitCore
          final class AuditCompatibilityTests: XCTestCase {
              func testCurrentSettingsRemainReadableBySupported180() throws {
                  let path = ProcessInfo.processInfo.environment["RUNNER_TEMP"]! + "/settings-1.8.1.json"
                  let data = try Data(contentsOf: URL(fileURLWithPath:path))
                  var control = try XCTUnwrap(JSONSerialization.jsonObject(with:data) as? [String:Any])
                  var planning = try XCTUnwrap(control["planning"] as? [String:Any])
                  planning.removeValue(forKey:"bikeWalkGainSeconds");control["planning"] = planning
                  XCTAssertNoThrow(try LiveSettings.decode(JSONSerialization.data(withJSONObject:control),appVersion:ProcessInfo.processInfo.environment["LEGACY_APP_VERSION"]!))
                  XCTAssertNoThrow(try LiveSettings.decode(data,appVersion:ProcessInfo.processInfo.environment["LEGACY_APP_VERSION"]!), "The installed released decoder must accept the common feed")
              }
          }
          SWIFT
          swift test --package-path "$RUNNER_TEMP/legacy-180/ios/TransitCore" --filter AuditCompatibilityTests | tee "$RUNNER_TEMP/config-compat-audit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-config-compatibility-${{ matrix.version }}
          path: ${{ runner.temp }}/config-compat-audit.log
          retention-days: 14
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate downloaded content
        run: python3 ios/live-update.py validate runtime/settings.json
      - name: Validate arrival tuning
        run: python3 ios/live-update.py validate-tuning runtime/tuning.json
      - name: Refresh the CDN copy phones use when GitHub is unreachable
        if: github.event_name == 'push'
        run: ./.github/purge-runtime-mirror.sh
      - name: Validate the update switch against the App Store
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          policy = json.load(open('runtime/app-update.json', encoding='utf-8'))
          version = re.compile(r'\d{1,4}(\.\d{1,4}){0,3}')
          assert set(policy) <= {'schemaVersion', 'minimumVersion', 'recommendedVersion', 'message', 'englishMessage'}, 'unknown field'
          assert policy.get('schemaVersion') == 1 and version.fullmatch(policy.get('minimumVersion', '')), 'schema or minimumVersion'
          assert 'recommendedVersion' not in policy or version.fullmatch(policy['recommendedVersion']), 'recommendedVersion'
          assert all(0 < len(policy.get(k, 'x')) <= 300 for k in ('message', 'englishMessage')), 'message length'
          parts = lambda text: [int(x) for x in text.split('.')] + [0] * (4 - text.count('.') - 1)
          with urllib.request.urlopen('https://itunes.apple.com/lookup?id=6818475740&country=tw', timeout=30) as response:
              live = json.load(response)['results'][0]['version']
          for key in ('minimumVersion', 'recommendedVersion'):
              if key in policy and parts(policy[key]) > parts(live):
                  print(f'::warning::{key} {policy[key]} is above the App Store version {live}; phones ignore it until that version is live.')
          print(f'Update switch valid; App Store (Taiwan) version {live}.')
          PY
  # Phones accept settings.json only when its revision is higher than the one they have. When
  # the file is edited by hand on main without raising it, raise it here so the edit takes effect.
  revision:
    if: github.event_name == 'push'
    needs: [validate, legacy_compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Raise the revision of a hand-edited settings file
        run: |
          set -euo pipefail
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) echo 'No earlier commit to compare.'; exit 0;; esac
          git fetch -q --depth=1 origin "$BEFORE"
          git show "$BEFORE:runtime/settings.json" > "$RUNNER_TEMP/before.json"
          changed=$(python3 - "$RUNNER_TEMP/before.json" runtime/settings.json <<'PY'
          import json, sys
          before, after = (json.load(open(path, encoding='utf-8-sig')) for path in sys.argv[1:])
          if after['revision'] > before['revision'] or {**before, 'revision': 0} == {**after, 'revision': 0}:
              print('no')
          else:
              after['revision'] = max(after['revision'], before['revision']) + 1
              open(sys.argv[2], 'w', encoding='utf-8').write(json.dumps(after, ensure_ascii=False, indent=2) + '\n')
              print(after['revision'])
          PY
          )
          if [ "$changed" = no ]; then echo 'Revision already raised or content unchanged.'; exit 0; fi
          python3 ios/live-update.py validate runtime/settings.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -am "Raise app content revision to $changed"
          git push -q origin HEAD:main
          ./.github/purge-runtime-mirror.sh
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'validate' && github.ref == 'refs/heads/main'
    needs: [validate, legacy_compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUS_LIVE_DOCUMENT: ${{ inputs.document }}
      BUS_RESTORE_REVISION: ${{ inputs.restore_revision }}
      BUS_LIVE_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish validated content or restore earlier content
        run: |
          python3 - <<'PY'
          import os, subprocess
          if os.environ['BUS_LIVE_OPERATION'] == 'publish':
              command = ['python3', 'ios/live-update.py', 'publish']
          else:
              value = os.environ['BUS_RESTORE_REVISION']
              if not value.isdecimal() or int(value) <= 0:
                  raise SystemExit('Specify the earlier positive content revision to restore.')
              command = ['python3', 'ios/live-update.py', 'rollback', value]
          subprocess.run(command, check=True)
          PY
      # A push made with the workflow token starts no other workflow, so purge here as well.
      - name: Refresh the CDN copy phones use when GitHub is unreachable
        run: ./.github/purge-runtime-mirror.sh
