name: TestFlight

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Check account, register App ID, upload, or finish an existing upload'
        type: choice
        options: ['beta-audit', 'beta-metadata', 'check-only', 'billing-audit', 'billing-prepare', 'store-audit', 'store-draft', 'store-prepare', 'store-assets', 'store-submit', 'store-pause', 'store-verify', 'register-app-id', 'upload', 'finish-processing', 'collect-route-times', 'collect-metro-data', 'collect-metro-levels', 'collect-fares', 'collect-voice-places']
        default: 'check-only'
      metro_endpoints:
        description: 'Optional bounded metro metadata endpoint subset'
        type: string
        default: ''
      route_ids:
        description: 'For official travel times: comma-separated published route IDs; empty uses every route'
        type: string
        default: ''
      publish_data:
        description: 'Publish validated public travel-time data for the beta app'
        type: boolean
        default: false
      bundle_id:
        description: 'Leave empty to use BUS_BUNDLE_ID repository variable / release config'
        type: string
        default: ''
      version:
        description: 'Marketing version; leave empty to use release config'
        type: string
        default: ''
      resume_build:
        description: 'Exact build number from the receipt; required for finish-processing'
        type: string
        default: ''
      order_screenshots:
        description: 'For store-verify: put the verified feature screenshots first'
        type: boolean
        default: false
      diagnostic_logs:
        description: 'Read redacted crash summaries for the exact existing beta build'
        type: boolean
        default: false

permissions:
  contents: read

# Never interrupt an archive/upload in progress. Serialize releases to avoid build collisions.
concurrency:
  group: testflight-${{ github.repository }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  release:
    if: inputs.operation != 'collect-route-times' && inputs.operation != 'collect-metro-data' && inputs.operation != 'collect-metro-levels' && inputs.operation != 'collect-fares'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
      APPLE_DISTRIBUTION_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}
      APPLE_APP_STORE_PROFILE: ${{ secrets.APPLE_APP_STORE_PROFILE }}
      BUS_BUNDLE_ID: ${{ inputs.bundle_id || vars.BUS_BUNDLE_ID }}
      BUS_VERSION: ${{ inputs.version }}
      BUS_BUILD_NUMBER: ${{ inputs.resume_build }}
      BUS_FEEDBACK_EMAIL: ${{ vars.BUS_FEEDBACK_EMAIL }}
      BUS_PRIVACY_POLICY_URL: ${{ vars.BUS_PRIVACY_POLICY_URL }}
      BUS_PUBLISH_TESTFLIGHT: ${{ inputs.operation != 'beta-audit' && inputs.operation != 'check-only' && inputs.operation != 'store-audit' && inputs.operation != 'billing-audit' }}
      APP_STORE_REVIEW_CONTACT: ${{ secrets.APP_STORE_REVIEW_CONTACT }}
      # Public values of the assistant server; the Claude and Groq keys stay on that server.
      BUS_ASSISTANT_URL: ${{ vars.SUPABASE_URL }}
      BUS_ASSISTANT_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      BUS_ORDER_SCREENSHOTS: ${{ inputs.order_screenshots }}
      BUS_UPDATE_BETA_METADATA: ${{ inputs.operation == 'beta-metadata' }}
      BUS_PREPARE_BILLING: ${{ inputs.operation == 'billing-prepare' }}
      BUS_STORE_DRAFT_ONLY: ${{ inputs.operation == 'store-draft' }}
      BUS_PAUSE_STORE: ${{ inputs.operation == 'store-pause' }}
    steps:
      - uses: actions/checkout@v4
      - name: Withdraw the exact user-paused App Store submission
        if: inputs.operation == 'store-pause'
        run: ruby ios/release/store_pause.rb
      - name: Preserve the Apple pause confirmation
        if: always() && inputs.operation == 'store-pause'
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-paused-${{ github.run_id }}
          path: ${{ runner.temp }}/app-store-paused.json
          retention-days: 30
      - name: Validate release source and Apple configuration
        run: |
          set -euo pipefail
          python3 ios/release-check.py
          ruby ios/release/apple_client_test.rb
          ruby ios/release/review_bundle_test.rb
          ruby ios/release/subscription_draft_test.rb
          ruby ios/release/regional_prices_test.rb
          ruby -c ios/release/store_prepare.rb
          ruby -c ios/release/store_submit.rb
          ruby -c ios/release/billing-prepare.rb
          python3 ios/release/signing_test.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          required = ['APPLE_TEAM_ID', 'ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_PRIVATE_KEY']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Secrets: ' + ', '.join(missing) + '. See ios/CLOUD_BUILD.md.')
          directory = Path(os.environ['RUNNER_TEMP']) / 'bus-signing'
          directory.mkdir(mode=0o700, exist_ok=True)
          key = directory / 'AuthKey.p8'
          key.write_text(os.environ['ASC_PRIVATE_KEY'].lstrip('\ufeff').strip() + '\n')
          key.chmod(0o600)
          PY
      - name: Read or update exact TestFlight metadata without rebuilding
        if: inputs.operation == 'beta-audit' || inputs.operation == 'beta-metadata'
        run: ruby ios/release/beta_metadata.rb
      - name: Read redacted diagnostics for the exact existing build
        if: inputs.operation == 'beta-audit' && inputs.diagnostic_logs
        run: ruby ios/release/island_diagnostics.rb
      - uses: actions/upload-artifact@v4
        if: always() && inputs.operation == 'beta-audit' && inputs.diagnostic_logs
        with:
          name: TestFlight-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/testflight-diagnostics.json
          retention-days: 14
      - name: Preserve TestFlight metadata readback
        if: always() && (inputs.operation == 'beta-audit' || inputs.operation == 'beta-metadata')
        uses: actions/upload-artifact@v4
        with:
          name: TestFlight-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/testflight-metadata.json
          retention-days: 30
      - name: Read-only App Store readiness audit
        if: inputs.operation == 'store-audit'
        run: ruby ios/release/store_audit.rb
      - name: Read-only billing catalog audit
        if: inputs.operation == 'billing-audit'
        run: ruby ios/release/billing-audit.rb
      - name: Preserve billing catalog audit
        if: inputs.operation == 'billing-audit'
        uses: actions/upload-artifact@v4
        with:
          name: billing-audit
          path: ${{ runner.temp }}/billing-audit.json
          retention-days: 7
      - name: Prepare approved subscription drafts
        if: inputs.operation == 'billing-prepare'
        run: ruby ios/release/billing-prepare.rb
      - name: Read back prepared subscription metadata
        if: always() && inputs.operation == 'billing-prepare'
        run: ruby ios/release/billing-audit.rb
      - name: Preserve subscription metadata readback
        if: always() && inputs.operation == 'billing-prepare'
        uses: actions/upload-artifact@v4
        with:
          name: billing-audit
          path: ${{ runner.temp }}/billing-audit.json
          retention-days: 7
      - name: Preserve subscription setup receipt
        if: always() && inputs.operation == 'billing-prepare'
        uses: actions/upload-artifact@v4
        with:
          name: billing-setup
          path: ${{ runner.temp }}/billing-setup.json
          retention-days: 30
      - name: Preserve redacted App Store readiness audit
        if: inputs.operation == 'store-audit'
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/app-store-audit.json
          retention-days: 7
      - name: Prepare public App Store metadata and exact valid build
        if: inputs.operation == 'store-prepare' || inputs.operation == 'store-draft'
        run: |
          ruby -c ios/release/store_prepare.rb
          ruby ios/release/store_prepare.rb
      - name: Upload prepared screenshots to the editable update
        if: inputs.operation == 'store-assets' || inputs.operation == 'store-draft'
        run: |
          ruby -c ios/release/store_assets.rb
          ruby ios/release/store_assets.rb
          ruby ios/release/store_verify.rb
      - name: Verify and submit the exact public update for review
        if: inputs.operation == 'store-submit'
        run: |
          ruby ios/release/store_verify.rb
          ruby -c ios/release/store_submit.rb
          ruby ios/release/store_submit.rb
      - name: Preserve Apple review submission confirmation
        if: inputs.operation == 'store-submit'
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-submitted-${{ github.run_id }}
          path: ${{ runner.temp }}/app-store-submitted.json
          retention-days: 30
      - name: Preserve public release preparation receipt
        if: always() && (inputs.operation == 'store-prepare' || inputs.operation == 'store-draft')
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/app-store-receipt.json
          retention-days: 30
      - name: Verify Taiwan free availability and processed store screenshots
        if: inputs.operation == 'store-verify'
        run: |
          ruby -c ios/release/store_verify.rb
          ruby ios/release/store_verify.rb
      - name: Preserve public store verification
        if: inputs.operation == 'store-verify' || inputs.operation == 'store-assets' || inputs.operation == 'store-draft'
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/app-store-verification.json
          retention-days: 30
      - name: Register App ID only
        if: inputs.operation == 'register-app-id'
        run: ruby ios/apple-connect.rb register-app-id
      - name: Verify app record and select exact build number
        if: inputs.operation == 'check-only' || inputs.operation == 'upload'
        run: ruby ios/apple-connect.rb preflight
      - name: Install App Store distribution signing
        if: inputs.operation == 'upload'
        run: python3 ios/release/signing.py install
      - name: Create and install the widget extension profile
        if: inputs.operation == 'upload'
        run: |
          set -euo pipefail
          ruby ios/apple-connect.rb widget-profile
          python3 ios/release/signing.py install-extension
      - name: Test transit algorithms and compile signed iPhone archive
        if: inputs.operation == 'upload'
        run: |
          set -euo pipefail
          xcodebuild -version
          swift test --package-path ios/TransitCore
          # Online understanding goes through the app's own server: only its public URL and
          # publishable key are built in. No secret is ever written into the app.
          BUS_ASSISTANT_URL="$(printf '%s' "${BUS_ASSISTANT_URL:-}" | tr -d '[:space:]')"
          BUS_ASSISTANT_KEY="$(printf '%s' "${BUS_ASSISTANT_KEY:-}" | tr -d '[:space:]')"
          if [ -n "${BUS_ASSISTANT_URL:-}" ] && [ -n "${BUS_ASSISTANT_KEY:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :BusAssistantURL ${BUS_ASSISTANT_URL}" ios/TaipeiBus/Info.plist
            /usr/libexec/PlistBuddy -c "Set :BusAssistantKey ${BUS_ASSISTANT_KEY}" ios/TaipeiBus/Info.plist
            echo "Assistant server: ${BUS_ASSISTANT_URL}"
          else
            echo "::notice::No assistant server configured; this build understands sentences on the phone only."
          fi
          xcodebuild -project ios/TaipeiBus.xcodeproj -scheme TaipeiBus \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TaipeiBus.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/bus-signing/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" BUS_APP_BUNDLE_ID="$BUS_BUNDLE_ID" \
            MARKETING_VERSION="$BUS_VERSION" CURRENT_PROJECT_VERSION="$BUS_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$BUS_SIGNING_CERTIFICATE_SHA1" \
            BUS_APP_PROFILE_UUID="$BUS_PROFILE_UUID" BUS_WIDGET_PROFILE_UUID="$BUS_WIDGET_PROFILE_UUID" archive | tee "$RUNNER_TEMP/testflight-archive.log"
          python3 ios/release-check.py --archive "$RUNNER_TEMP/TaipeiBus.xcarchive" \
            --bundle-id "$BUS_BUNDLE_ID" --version "$BUS_VERSION" --build-number "$BUS_BUILD_NUMBER"
          python3 ios/ai/check-weak-link.py "$RUNNER_TEMP/TaipeiBus.xcarchive/Products/Applications/TaipeiBus.app/TaipeiBus"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/TaipeiBus.xcarchive/dSYMs" "$RUNNER_TEMP/testflight-dSYMs.zip"
      - name: Upload archive to App Store Connect
        if: inputs.operation == 'upload'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'bus-signing/ExportOptions.plist'
          with path.open('wb') as output:
              plistlib.dump({'method': 'app-store-connect', 'destination': 'upload',
                            'teamID': os.environ['APPLE_TEAM_ID'], 'signingStyle': 'manual',
                            'signingCertificate': os.environ['BUS_SIGNING_CERTIFICATE_SHA1'],
                            'provisioningProfiles': {os.environ['BUS_BUNDLE_ID']: os.environ['BUS_PROFILE_UUID'],
                                                     os.environ['BUS_BUNDLE_ID'] + '.Widgets': os.environ['BUS_WIDGET_PROFILE_UUID']},
                            'manageAppVersionAndBuildNumber': False}, output)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TaipeiBus.xcarchive" \
            -exportPath "$RUNNER_TEMP/BusExport" \
            -exportOptionsPlist "$RUNNER_TEMP/bus-signing/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/bus-signing/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/testflight-upload.log"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'testflight-receipt.json'
          data = json.loads(path.read_text())
          data.update(status='uploaded_processing_pending', upload_confirmed=True,
                      uploaded_at=datetime.now(timezone.utc).isoformat())
          path.write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"Upload command succeeded: {data['version']} ({data['build_number']}). Apple processing and tester availability are still pending.\n\n")
          PY
          echo 'BUS_UPLOAD_SUCCEEDED=true' >> "$GITHUB_ENV"
      - name: Confirm exact build and assign internal testing group
        if: inputs.operation == 'upload' || inputs.operation == 'finish-processing'
        run: ruby ios/apple-connect.rb processing
      - name: Preserve release receipt, logs and crash symbols
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestFlight-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/testflight-receipt.json
            ${{ runner.temp }}/testflight-archive.log
            ${{ runner.temp }}/testflight-upload.log
            ${{ runner.temp }}/testflight-dSYMs.zip
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing files and keychain
        if: always()
        run: |
          python3 ios/release/signing.py cleanup

  official_times:
    if: inputs.operation == 'collect-route-times'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test collection and publication rules before using account quota
        run: python3 ios/release/official_times_test.py
      - name: Read the published catalog for comparison (GitHub only, no TDX quota)
        run: gh release download travel-time-data --pattern official-times.json --dir "$RUNNER_TEMP/published" --repo "$GITHUB_REPOSITORY"
      - name: Collect bounded shared public time profiles
        env:
          REQUESTED_ROUTES: ${{ inputs.route_ids }}
        run: python3 ios/release/collect-route-times.py --routes "$REQUESTED_ROUTES" --out "$RUNNER_TEMP/route-times/official-times.json"
      - name: Keep unanswered routes and check what phones would receive
        env:
          PUBLISH: ${{ inputs.publish_data }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PUBLISH" != true ]; then flags+=(--report-only); fi
          python3 ios/release/official_times_gate.py prepare \
            --candidate "$RUNNER_TEMP/route-times/official-times.json" \
            --coverage "$RUNNER_TEMP/route-times/coverage.json" \
            --published "$RUNNER_TEMP/published/official-times.json" \
            --out "$RUNNER_TEMP/route-times/publish" "${flags[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-route-times-${{ github.run_id }}
          path: ${{ runner.temp }}/route-times/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish validated source data for the app
        if: inputs.publish_data
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/route-times/publish"
          # The manifest goes last so it never names a catalog that is not yet uploaded.
          gh release upload travel-time-data "$out/official-times.json" "$out/official-times.json.gz" "$out/coverage.json" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload travel-time-data "$out/official-times-manifest.json" --clobber --repo "$GITHUB_REPOSITORY"

  metro:
    if: inputs.operation == 'collect-metro-data'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect bounded official metro metadata
        run: python3 ios/release/collect-metro-data.py --out "$RUNNER_TEMP/metro" --endpoints "${{ inputs.metro_endpoints }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-metro-metadata
          path: ${{ runner.temp }}/metro
          if-no-files-found: ignore
          retention-days: 30

  fares:
    if: inputs.operation == 'collect-fares'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect official metro and city bus fares
        run: python3 ios/release/collect-fares.py --out "$RUNNER_TEMP/fares"
      - name: Publish the public fare snapshot as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view fare-data >/dev/null 2>&1 || gh release create fare-data --prerelease --latest=false \
            --title 'Official fare data' --notes 'MOTC TDX official fares (Open Government Data License 1.0).'
          gh release upload fare-data "$RUNNER_TEMP/fares/fares-raw.json.gz" "$RUNNER_TEMP/fares/fares-shape.json" --clobber

  voice-places:
    if: inputs.operation == 'collect-voice-places'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect official place names for voice recognition
        run: python3 ios/release/collect-voice-places.py --out ios/TransitCore/Sources/TransitCore/Places/voice-places.json
      - name: Commit the names to the branch this ran on
        run: |
          set -euo pipefail
          git add ios/TransitCore/Sources/TransitCore/Places/voice-places.json
          if git diff --cached --quiet; then echo 'No change'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Official place names for voice recognition (TDX tourism data)'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  metro-levels:
    if: inputs.operation == 'collect-metro-levels'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect OpenStreetMap metro track structure (no credentials)
        run: python3 ios/release/collect-metro-levels.py --out "$RUNNER_TEMP/metro-levels"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm-metro-levels
          path: ${{ runner.temp }}/metro-levels
          if-no-files-found: ignore
          retention-days: 30
