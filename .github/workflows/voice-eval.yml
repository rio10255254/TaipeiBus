name: Voice conversation evaluation

# Asks the real models a fixed set of conversation turns with the server's own prompt and checks each
# answer the way the app would. Runs when the conversation prompt or its checks change.
# Then asks the current model again the turns riders reported, and writes a verdict on each back to
# assistant_feedback (weekly, by hand, and after the evaluation on pull requests). This repository is
# public, so that log holds only report ids, fixed labels and counts; the reports stay in the database.
on:
  pull_request:
    paths: ['supabase/functions/converse/**', 'supabase/functions/_shared/**', '.github/workflows/voice-eval.yml']
  workflow_dispatch:
  schedule:
    # Mondays 09:17 in Taipei.
    - cron: '17 1 * * 1'

permissions:
  contents: read

jobs:
  evaluate:
    # The weekly run only replays reports; the fixed turns change only with the code.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Ask and check
        run: deno run --allow-env --allow-net --no-lock --config supabase/functions/converse/deno.json supabase/functions/converse/eval.ts

  replay-reports:
    needs: evaluate
    # After the evaluation whatever it found; on its own when the evaluation is skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: voice-replay
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      # A pull request's prompt may not ship: its replay reports without writing verdicts.
      REPLAY_WRITE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Stop here until the project is set up
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Add the SUPABASE_ACCESS_TOKEN and ANTHROPIC_API_KEY secrets and the SUPABASE_PROJECT_REF variable to replay reported answers."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
      - uses: denoland/setup-deno@v2
        if: steps.ready.outputs.ready == 'true'
        with:
          deno-version: v2.x
      # Prints only report ids, verdict labels and counts. Fails only when Supabase or Claude could not
      # be asked; answers that still fail are for the owner to read in the table.
      - name: Ask the reported turns again
        if: steps.ready.outputs.ready == 'true'
        run: deno run --allow-env --allow-net --no-lock --config supabase/functions/converse/deno.json supabase/functions/converse/replay.ts
