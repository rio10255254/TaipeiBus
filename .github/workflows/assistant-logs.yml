name: Assistant logs

# Temporary diagnosis on a feature branch, never merged: prints the assistant functions' own error
# lines from the last hours. Only messages the functions write themselves are printed; no user IDs,
# requests or keys.
on:
  push:
    branches: [claude/dreamy-ramanujan-qzvqf5]
    paths: ['.github/workflows/assistant-logs.yml']

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Read recent function error lines
        run: |
          ref=$(printf %s "$SUPABASE_PROJECT_REF" | tr -d '\r\n ')
          start=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          query() {
            curl -sS -G "https://api.supabase.com/v1/projects/$ref/analytics/endpoints/logs" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" \
              -o "$2" -w "HTTP %{http_code}\n"
          }
          query "SELECT source, count() AS n FROM logs GROUP BY source" sources.json
          query "SELECT timestamp, source, event_message FROM logs WHERE event_message LIKE '%pro check failed%' OR event_message LIKE '%transaction not verified%' OR event_message LIKE '%apple roots%' OR event_message LIKE '%claude stream failed%' OR event_message LIKE '%no answer%' ORDER BY timestamp DESC LIMIT 60" errors.json
          python3 - <<'EOF'
          import json, re
          for name in ('sources.json', 'errors.json'):
              data = json.load(open(name))
              if 'result' not in data or data.get('error'):
                  print(name, 'error:', str(data)[:300]); continue
              print('==', name, len(data['result']), 'rows')
              for row in data['result'][:60]:
                  text = re.sub(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', '<id>', json.dumps(row, ensure_ascii=False))
                  print(text[:400])
          EOF
